<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7a1018">
<title>Descubra sua Ceia de Natal Econômica | Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#a3161f; --red-dk:#7a1018; --green:#1f6b45; --green-dk:#134a30;
    --gold:#e0a63b; --cream:#fdf7ee; --paper:#ffffff; --ink:#2a1a14; --muted:#7b6a60;
    --line:#efe2d0; --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Nunito',system-ui,sans-serif;color:var(--ink);
    background:var(--cream);
    background-image:radial-gradient(circle at 10% 0%,#fbe9d3 0,transparent 40%),radial-gradient(circle at 100% 100%,#f6e0c4 0,transparent 45%);
    min-height:100dvh;
  }
  .app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:0 18px calc(24px + env(safe-area-inset-bottom))}

  /* topo */
  header{position:sticky;top:0;z-index:5;padding:14px 0 10px;background:linear-gradient(var(--cream) 75%,transparent)}
  .topbar{display:flex;align-items:center;gap:10px}
  .back{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;flex:none;visibility:hidden}
  .back.show{visibility:visible}
  .back svg{width:18px;height:18px}
  .brand{flex:1;text-align:center;font-family:'Fraunces',serif;font-weight:800;font-size:17px;color:var(--red-dk);letter-spacing:.2px}
  .brand span{color:var(--green)}
  .spacer{width:36px;flex:none}
  .progress{margin-top:12px;display:none}
  .progress.show{display:block}
  .phase-label{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
  .bar{height:8px;background:#f0e3d1;border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),#2f9a63);border-radius:99px;transition:width .45s ease}

  /* telas */
  main{flex:1;position:relative}
  .screen{animation:in .4s ease both}
  @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  h1,h2{font-family:'Fraunces',serif;line-height:1.15;color:var(--red-dk)}
  h1{font-size:30px;font-weight:800}
  h2{font-size:24px;font-weight:800;margin:8px 0 6px}
  .sub{color:var(--muted);font-size:15.5px;line-height:1.5;margin-bottom:18px}
  .tag{display:inline-block;background:#fff3dc;color:#9a6512;border:1px solid #f1d9a6;font-size:12px;font-weight:800;padding:5px 10px;border-radius:99px;letter-spacing:.3px;text-transform:uppercase}

  /* capa */
  .hero{text-align:center;padding-top:6px}
  .hero img.mock{width:78%;max-width:280px;margin:8px auto 4px;display:block;filter:drop-shadow(0 18px 24px rgba(122,16,24,.25))}
  .hero h1{margin:12px 0 10px}
  .hero h1 em{font-style:normal;color:var(--green)}
  .chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:6px 0 20px}
  .chip{font-size:13px;font-weight:700;background:#fff;border:1px solid var(--line);padding:6px 11px;border-radius:99px}

  /* opções */
  .opts{display:flex;flex-direction:column;gap:11px}
  .opt{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    background:var(--paper);border:2px solid var(--line);border-radius:var(--radius);
    padding:15px 16px;font:700 16px 'Nunito',sans-serif;color:var(--ink);cursor:pointer;
    box-shadow:0 2px 0 #ead9c2;transition:transform .08s,border-color .15s,background .15s;
  }
  .opt .emo{font-size:24px;width:32px;text-align:center;flex:none}
  .opt .txt{flex:1}
  .opt .txt small{display:block;font-weight:600;color:var(--muted);font-size:13px;margin-top:2px}
  .opt:active{transform:scale(.98)}
  .opt.sel{border-color:var(--green);background:#eef8f1}
  .opt.sel::after{content:"✓";margin-left:auto;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:14px;flex:none}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .card{background:#fff;border:2px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;padding:0;font:800 15px 'Nunito';color:var(--ink);box-shadow:0 2px 0 #ead9c2;transition:transform .08s,border-color .15s}
  .card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#f3e6d4}
  .card .ph{width:100%;aspect-ratio:1/1;display:grid;place-items:center;font-size:56px;background:linear-gradient(135deg,#fbecd6,#f5dcb9)}
  .card span{display:block;padding:11px 8px}
  .card:active{transform:scale(.97)}
  .card:nth-child(odd):last-child{grid-column:1/-1;display:flex;align-items:center}
  .card:nth-child(odd):last-child .ph{width:72px;aspect-ratio:1/1;font-size:34px;flex:none}
  .card:nth-child(odd):last-child span{text-align:left;padding:0 16px}
  .card.sel{border-color:var(--green);background:#eef8f1}

  /* botões */
  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;cursor:pointer;
    background:linear-gradient(180deg,#2f9a63,var(--green));color:#fff;font:800 17px 'Nunito';
    padding:18px 20px;border-radius:14px;box-shadow:0 5px 0 var(--green-dk),0 10px 22px rgba(31,107,69,.28);
    text-decoration:none;text-align:center;transition:transform .08s,box-shadow .08s;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--green-dk)}
  .btn.red{background:linear-gradient(180deg,#c42630,var(--red));box-shadow:0 5px 0 var(--red-dk),0 10px 22px rgba(163,22,31,.3)}
  .btn.red:active{box-shadow:0 1px 0 var(--red-dk)}
  .btn.pulse{animation:pulse 1.8s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
  .fine{text-align:center;font-size:12.5px;color:var(--muted);margin-top:12px}

  /* bloco de explicação */
  .info{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin:6px 0 18px;box-shadow:0 8px 24px rgba(90,40,10,.06)}
  .info p{font-size:15.5px;line-height:1.55;margin-bottom:10px}
  .info p:last-child{margin-bottom:0}
  .info b{color:var(--red-dk)}
  .compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 4px}
  .compare div{border-radius:12px;padding:12px;font-size:13.5px;line-height:1.45;font-weight:600}
  .compare .bad{background:#fdecec;color:#7a1018}
  .compare .good{background:#e9f6ee;color:#134a30}
  .compare strong{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
  .stat{display:flex;align-items:center;gap:14px;background:#fff7e8;border:1px dashed #e9c98a;border-radius:14px;padding:14px;margin-bottom:16px}
  .stat .big{font-family:'Fraunces',serif;font-size:34px;font-weight:800;color:var(--red)}
  .stat p{font-size:14px;line-height:1.45}

  /* loading */
  .loading{text-align:center;padding-top:30px}
  .ring{width:150px;height:150px;margin:0 auto 22px;position:relative}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:10}
  .ring .bg{stroke:#f0e3d1}
  .ring .fg{stroke:var(--green);stroke-linecap:round;stroke-dasharray:408;stroke-dashoffset:408;transition:stroke-dashoffset .2s linear}
  .ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-family:'Fraunces',serif;font-size:36px;font-weight:800;color:var(--red-dk)}
  .steps{list-style:none;text-align:left;max-width:330px;margin:22px auto 0;display:flex;flex-direction:column;gap:12px}
  .steps li{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;color:#b9a898;transition:color .3s}
  .steps li .dot{width:24px;height:24px;border-radius:50%;border:2px solid #e3d3bf;display:grid;place-items:center;font-size:13px;flex:none;transition:all .3s}
  .steps li.on{color:var(--ink)}
  .steps li.on .dot{border-color:var(--gold);border-top-color:transparent;animation:spin .8s linear infinite}
  .steps li.done{color:var(--green-dk)}
  .steps li.done .dot{background:var(--green);border-color:var(--green);color:#fff;animation:none}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* resultado */
  .result-head{text-align:center;background:linear-gradient(160deg,var(--red),var(--red-dk));color:#fff;border-radius:20px;padding:22px 18px;margin-bottom:18px;position:relative;overflow:hidden}
  .result-head::before{content:"❄ ✦ ❄ ✦ ❄ ✦ ❄";position:absolute;top:6px;left:0;right:0;font-size:11px;opacity:.35;letter-spacing:6px}
  .result-head h2{color:#fff;font-size:25px;margin-top:8px}
  .result-head .tag{background:rgba(255,255,255,.15);color:#ffe2a8;border-color:rgba(255,255,255,.25)}
  .result-head p{opacity:.92;font-size:15px;line-height:1.5;margin-top:8px}
  .profile{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
  .profile div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
  .profile small{display:block;font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .profile b{font-size:15px;color:var(--ink)}
  .plan{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:18px}
  .plan h3{font-family:'Fraunces',serif;color:var(--red-dk);font-size:19px;margin-bottom:12px}
  .plan ul{list-style:none;display:flex;flex-direction:column;gap:10px}
  .plan li{display:flex;gap:10px;font-size:15px;line-height:1.4}
  .plan li::before{content:"✓";flex:none;width:22px;height:22px;border-radius:50%;background:#e9f6ee;color:var(--green);display:grid;place-items:center;font-weight:900;font-size:13px}
  .mockrow{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px 18px;padding:4px 18px 8px}
  .mockrow img{height:190px;border-radius:10px;scroll-snap-align:start;box-shadow:0 6px 16px rgba(0,0,0,.12);flex:none}
  .offer{border:2.5px solid var(--green);border-radius:20px;background:#fff;padding:20px 18px;margin-bottom:14px;position:relative}
  .offer.best{border-color:var(--gold);box-shadow:0 12px 30px rgba(224,166,59,.25)}
  .ribbon{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--gold);color:#4a2c00;font-size:12px;font-weight:900;padding:5px 14px;border-radius:99px;white-space:nowrap;letter-spacing:.3px}
  .offer h4{font-family:'Fraunces',serif;font-size:20px;color:var(--red-dk);text-align:center;margin-top:4px}
  .offer .desc{text-align:center;font-size:14px;color:var(--muted);margin:4px 0 10px}
  .offer ul{list-style:none;margin:10px 0 14px;display:flex;flex-direction:column;gap:7px}
  .offer li{font-size:14.5px;display:flex;gap:8px;line-height:1.35}
  .offer li::before{content:"🎁";flex:none}
  .offer .base li::before{content:"✓";color:var(--green);font-weight:900}
  .price{text-align:center;margin:6px 0 14px}
  .price s{color:#a99a8e;font-size:15px}
  .price .now{display:block;font-family:'Fraunces',serif;font-size:42px;font-weight:800;color:var(--green);line-height:1.1}
  .price small{font-size:13px;color:var(--muted);font-weight:700}
  .timer{display:flex;align-items:center;justify-content:center;gap:8px;background:#fff3dc;border:1px solid #f1d9a6;color:#7a4a00;border-radius:12px;padding:10px;font-weight:800;font-size:14px;margin-bottom:16px}
  .timer b{font-variant-numeric:tabular-nums}
  .guarantee{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:18px 0}
  .guarantee img{width:84px;flex:none}
  .guarantee p{font-size:14px;line-height:1.45}
  .guarantee b{display:block;font-family:'Fraunces',serif;color:var(--red-dk);font-size:17px;margin-bottom:3px}

  /* bônus + pop-up */
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .row s{color:#a99a8e;font-size:13.5px;white-space:nowrap;flex:none}
  .offer li.row::before{display:none}
  .offer .base li.row span::before{content:"✓ ";color:var(--green);font-weight:900}
  .extras{margin-top:4px!important}
  .bonus{display:flex;gap:12px;background:#fffaf1;border:2px solid #f1d58f;border-radius:16px;padding:12px;margin:10px 0}
  .bonus img{width:78px;height:110px;object-fit:cover;border-radius:6px;box-shadow:0 4px 10px rgba(0,0,0,.18);flex:none;background:#f3e6d4}
  .btag{display:inline-block;background:var(--red);color:#fff;font-size:10.5px;font-weight:900;text-transform:uppercase;letter-spacing:.3px;padding:3px 9px;border-radius:99px}
  .bonus h5{font-family:'Fraunces',serif;color:var(--green-dk);font-size:16.5px;line-height:1.2;margin:6px 0 3px}
  .bonus p{font-size:13px;color:var(--muted);line-height:1.35}
  .bonus s{display:block;font-size:13px;color:#a99a8e;margin:4px 0 8px}
  .see{border:0;background:var(--green);color:#fff;font:800 13.5px 'Nunito';padding:9px 14px;border-radius:99px;cursor:pointer}
  .see:active{transform:scale(.96)}
  .modal{position:fixed;inset:0;z-index:50;background:rgba(30,12,8,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
  @keyframes fade{from{opacity:0}}
  .sheet{background:var(--cream);width:100%;max-width:480px;max-height:86dvh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .3s ease}
  @keyframes up{from{transform:translateY(40px);opacity:0}}
  .sheet-head{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
  .sheet-head img{width:44px;height:62px;object-fit:cover;border-radius:4px;flex:none}
  .sheet-head h3{flex:1;font-family:'Fraunces',serif;color:var(--red-dk);font-size:18px;line-height:1.2}
  .sheet-head h3 small{display:block;font-family:'Nunito';font-size:12.5px;color:var(--muted);font-weight:700;margin-top:2px}
  .close{width:36px;height:36px;border-radius:50%;border:0;background:#f0e3d1;font-size:18px;cursor:pointer;flex:none}
  .sheet-body{overflow-y:auto;padding:6px 18px calc(18px + env(safe-area-inset-bottom))}
  .sheet-body h4{font-family:'Fraunces',serif;color:var(--green-dk);font-size:16px;margin:16px 0 8px}
  .sheet-body ol{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px 14px 6px 36px}
  .sheet-body li{font-size:14.5px;padding:7px 0;border-bottom:1px dashed #f0e3d1}
  .sheet-body li:last-child{border-bottom:0}

  /* VSL */
  .vsl-title{text-align:center;font-weight:800;font-size:16px;color:var(--red-dk);margin:4px 0 10px}
  .vsl{position:relative;width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#1b0d09;box-shadow:0 12px 28px rgba(60,20,10,.25);margin-bottom:18px}
  .vsl iframe,.vsl video{position:absolute;inset:0;width:100%;height:100%;border:0}
  .vsl-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#f3dcc0;font-weight:800;font-size:14px;border:2px dashed rgba(243,220,192,.35);border-radius:16px}
  .vsl-ph .play{width:64px;height:64px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:24px;padding-left:4px;box-shadow:0 6px 18px rgba(163,22,31,.5)}

  /* DEV: botão "Ir para o final" (REMOVER antes de publicar) */
  #devSkip{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:99;border:0;background:#222;color:#fff;font:800 12px 'Nunito';padding:10px 14px;border-radius:99px;opacity:.85;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3)}
  footer{text-align:center;font-size:11.5px;color:#a99a8e;padding:18px 0 4px;line-height:1.5}

  /* neve */
  .snow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .snow i{position:absolute;top:-10px;color:#e8cfae;animation:fall linear infinite;font-style:normal}
  @keyframes fall{to{transform:translateY(105vh) rotate(260deg)}}
  .app{position:relative;z-index:1}
</style>

<body>
<div class="snow" id="snow"></div>
<div class="app">
  <header>
    <div class="topbar">
      <button class="back" id="back" aria-label="Voltar"><svg viewBox="0 0 24 24" fill="none" stroke="#7a1018" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="brand">🎄 Ceia <span>Econômica</span> de Natal</div>
      <div class="spacer"></div>
    </div>
    <div class="progress" id="progress">
      <div class="phase-label"><span id="phaseName">Etapa 1 de 3</span><span id="stepCount">1/18</span></div>
      <div class="bar"><i id="barFill"></i></div>
    </div>
  </header>
  <main id="main"></main>
  <footer>Este site não é afiliado ao Facebook ou à Meta.<br>Preços de ingredientes são apenas referência.</footer>
</div>

<script>
/* ============ CONFIGURAÇÃO ============ */
const IMG = "https://ceia-econ-mica-de-natal.vercel.app/img/";
const CHECKOUT_ESSENCIAL = "https://pay.wiapy.com/X79lQo-CNcrL";
const CHECKOUT_COMPLETO  = "https://pay.wiapy.com/6aebb363605b6cd0b4100cb9";
const PROMO_FIM = new Date("2026-12-01T23:59:59-03:00");

/* ============ PERGUNTAS ============
   fase 1 = o que a pessoa quer (3)
   fase 2 = admitir o problema (5)
   fase 3 = mecanismo da solução + sucesso presumido + sequência de sims (10) */
const Q = [
  // ---------- FASE 1 ----------
  {phase:1,id:"idade",q:"Qual a sua idade?",sub:"Assim adaptamos o plano à sua rotina.",opts:[
    {e:"🌱",t:"18 a 29 anos"},{e:"🌿",t:"30 a 44 anos"},{e:"🌳",t:"45 a 59 anos"},{e:"🌲",t:"60 anos ou mais"}]},
  {phase:1,id:"pessoas",q:"Quantas pessoas vão estar na sua ceia este ano?",sub:"Vamos calcular as quantidades certas para você.",opts:[
    {e:"👫",t:"Até 4 pessoas"},{e:"👨‍👩‍👧",t:"5 a 8 pessoas"},{e:"👨‍👩‍👧‍👦",t:"9 a 15 pessoas"},{e:"🎉",t:"Mais de 15 pessoas"}]},
  {phase:1,id:"quer",q:"Você quer fazer uma ceia farta e bonita neste Natal gastando pouco?",opts:[
    {e:"😍",t:"Sim, quero muito!"},{e:"🙂",t:"Sim, se for possível"},{e:"🤔",t:"Talvez, quero entender como"}]},

  // ---------- FASE 2 ----------
  {phase:2,id:"orcamento",q:"Como está o seu orçamento para o Natal este ano?",opts:[
    {e:"😰",t:"Bem apertado",d:"Preciso fazer o dinheiro render"},
    {e:"😕",t:"Mais curto que o ano passado",d:"Tudo subiu de preço"},
    {e:"😐",t:"Razoável, mas não quero gastar à toa"}]},
  {phase:2,id:"ideias",q:"Você já ficou sem ideia do que preparar além do “arroz com frango” de sempre?",opts:[

/* ============ RASTREAMENTO (Meta Pixel + Clarity) ============ */
function track(type,name,params){

}

/* ============ SOM ============ */
let ac;
function audio(){ if(!ac){ try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){} } if(ac&&ac.state==="suspended")ac.resume(); return ac;}
function tone(freq,dur,type="sine",vol=.18,delay=0){
  const a=audio(); if(!a) return;
  const t=a.currentTime+delay, o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t); o.frequency.exponentialRampToValueAtTime(freq*1.5,t+dur*.6);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.02);
}
const sfx = {
  click(){ tone(660,.09,"triangle",.2); if(navigator.vibrate) navigator.vibrate(12); },
  start(){ tone(523,.12,"triangle",.18); tone(784,.16,"triangle",.18,.08); },
  done(){ [523,659,784,1047].forEach((f,i)=>tone(f,.22,"triangle",.16,i*.1)); }, // sininho
  tick(){ tone(1200,.04,"sine",.06); }
};

const state={i:-1,answers:{},history:[]};

const back=document.getElementById("back");

function setProgress(){
  const p=document.getElementById("progress");
  if(state.i<0||state.i>=Q.length){p.classList.remove("show");return;}
  p.classList.add("show");
  const q=Q[state.i];
  const done=Q.slice(0,state.i).filter(x=>x.type!=="info").length;
  document.getElementById("phaseName").textContent=PHASES[q.phase];
  document.getElementById("stepCount").textContent=q.type==="info"?"":Math.min(done+1,TOTAL)+"/"+TOTAL;
  document.getElementById("barFill").style.width=(done/TOTAL*100+3)+"%";
}

function go(i,push=true){
  if(push) state.history.push(state.i);
  state.i=i; window.scrollTo({top:0,behavior:"smooth"});
  back.classList.toggle("show",i>=0&&i<Q.length);
  setProgress();
  if(i<0) return renderIntro();
  if(i>=Q.length) return renderLoading();
  const q=Q[i];
  if(q.type==="info") return renderInfo();
  renderQuestion(q);
}

back.onclick=()=>{ sfx.click(); const prev=state.history.pop(); if(prev!==undefined) go(prev,false); };

function renderLoading(){

  main.innerHTML=`<section class="screen loading">

    <p class="sub">Estamos calculando a melhor ceia para o seu perfil.</p>
    <div class="ring"><svg viewBox="0 0 150 150"><circle class="bg" cx="75" cy="75" r="65"/><circle class="fg" id="fg" cx="75" cy="75" r="65"/></svg><div class="pct" id="pct">0%</div></div>
    <ul class="steps">${steps.map(s=>`<li><span class="dot"></span>${s}</li>`).join("")}</ul>
  </section>`;
  const li=[...main.querySelectorAll(".steps li")], fg=document.getElementById("fg"), pct=document.getElementById("pct");
  const DUR=6500, t0=performance.now(); let lastStep=-1;
  (function frame(now){
    const p=Math.min(1,(now-t0)/DUR), eased=1-Math.pow(1-p,1.6), v=Math.round(eased*100);
    pct.textContent=v+"%"; fg.style.strokeDashoffset=408-408*eased;
    const s=Math.min(steps.length-1,Math.floor(eased*steps.length));
    if(s!==lastStep){ li.forEach((el,k)=>{el.classList.toggle("done",k<s);el.classList.toggle("on",k===s);}); if(lastStep>=0) sfx.tick(); lastStep=s; }
    if(p<1) requestAnimationFrame(frame);
    else { li.forEach(el=>{el.classList.remove("on");el.classList.add("done")}); sfx.done(); setTimeout(renderResult,700); }
  })(t0);
}

function startCountdown(){

  const tick=()=>{ let ms=PROMO_FIM-new Date(); if(ms<0)ms=0;

    el.textContent=(d?d+"d ":"")+z(h)+":"+z(m)+":"+z(s); };
  tick(); setInterval(tick,1000);
}
